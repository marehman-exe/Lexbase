services:
  # FastAPI backend
  - type: web
    name: lexbase-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free          # upgrade to starter ($7/mo) for always-on
    region: oregon
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexbase-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: https://lexbase.vercel.app   # replace with your actual Vercel URL
      - key: GROQ_API_KEY
        sync: false                          # set manually in Render dashboard
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: SUPER_ADMIN_EMAIL
        value: admin@lexbase.internal
      - key: SUPER_ADMIN_PASSWORD
        sync: false                          # set manually in Render dashboard

databases:
  - name: lexbase-db
    plan: free                               # 90-day free tier on Render
    region: oregon
    # NOTE: pgvector extension must be enabled after first deploy:
    #   psql <DATABASE_URL> -c "CREATE EXTENSION IF NOT EXISTS vector;"
